name: V12 Alpha Research

on:
  workflow_dispatch:
  push:
    branches:
      - v12-alpha-research
    paths:
      - "v12_backtest.py"
      - "requirements.txt"
      - ".github/workflows/v12-alpha.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Syntax validation
        run: python -m py_compile v12_backtest.py

      - name: Run V12 alpha research
        run: python v12_backtest.py --start 2019-09-08 --initial 10000

      - name: Publish gate scorecard
        shell: bash
        run: |
          echo "## V12 Alpha gate scorecard" >> "$GITHUB_STEP_SUMMARY"
          python -c "import pandas as pd; print(pd.read_csv('results_v12/v12_alpha_scorecard.csv').to_markdown(index=False))" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import pandas as pd
          scorecard = pd.read_csv("results_v12/v12_alpha_scorecard.csv")
          fields = ["gate", "overfit_fail", "base_cagr", "base_sharpe", "base_mdd",
                    "oos_cagr", "oos_mdd", "robustness", "adaptive2x_mdd",
                    "frozen2x_mdd", "delay_mdd", "hard_stop_any", "turnover",
                    "cost_paid", "funding_paid", "max_gross"]
          for _, row in scorecard.iterrows():
              details = ", ".join(f"{field}={row[field]}" for field in fields)
              print(f"::notice title={row['candidate']} / {row['mode']}::{details}")
          PY

      - name: Upload separated research results
        uses: actions/upload-artifact@v4
        with:
          name: v12-alpha-research-results
          path: results_v12/
          if-no-files-found: error
          retention-days: 30
