name: BTC High-CAGR SAFER Dry-Run Paper

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */4 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/high-cagr-safer-paper.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: btc-high-cagr-safer-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: [self-hosted, Windows, X64, korea, safer-paper]
    timeout-minutes: 25
    env:
      SAFER_STATE_DIR: 'C:\actions-runner-safer\safer_state'

    steps:
      - name: Checkout frozen research branch
        uses: actions/checkout@v4
        with:
          ref: v13-decision-engine

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install requirements
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Safety and causality self-test
        shell: pwsh
        run: python high_cagr_safer_paper_selfhosted.py --self-test

      - name: Prepare persistent SAFER state directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:SAFER_STATE_DIR | Out-Null

      - name: Run Korea self-hosted public-data SAFER paper trader
        shell: pwsh
        run: python high_cagr_safer_paper_selfhosted.py --state-dir "$env:SAFER_STATE_DIR" --lookback-days 800

      - name: Upload SAFER paper state
        uses: actions/upload-artifact@v4
        with:
          name: high-cagr-safer-paper-state
          path: |
            C:\actions-runner-safer\safer_state\state.json
            C:\actions-runner-safer\safer_state\report.json
            C:\actions-runner-safer\safer_state\funding_cache.csv
          if-no-files-found: error
          retention-days: 90
